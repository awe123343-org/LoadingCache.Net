minimum_prek_version: "0.4.14"
# Dated benchmark runs include hash-bound reports, scripts and source snapshots.
# Keep their archived bytes intact; ordinary documentation remains checked.
exclude: >-
  (?x)(^|/)(artifacts|bin|obj|node_modules|\.idea|\.git|__pycache__)/|
  ^pnpm-lock\.yaml$|^docs/research-evidence/|^docs/benchmarks/.*\.(json|csv)$|
  ^docs/benchmarks/[^/]+-[0-9]{8}/|
  ^tools/LoadingCache\.Simulator/results/

repos:
  - repo: builtin
    hooks:
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md,markdown"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: ktlint-fmt
        name: Format and lint Kotlin files
        entry: bash tools/hooks/ktfmt-lint.sh
        language: system
        files: '\.(kt|kts)$'
        require_serial: true
      - id: ruff-check
        name: Ruff lint
        entry: uvx --from ruff==0.14.0 ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff format
        entry: uvx --from ruff==0.14.0 ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: oxfmt
        name: Oxfmt
        entry: bash run-oxfmt.sh
        language: system
        files: '\.(js|jsx|ts|tsx|mjs|cjs|css|json|jsonc|md|mdx|markdown|toml|yaml|yml|html)$'
        require_serial: true
      - id: dotnet-tool-restore
        name: Install .NET tools
        entry: dotnet tool restore
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
          - post-checkout
          - post-rewrite
          - manual
      - id: dotnet-format-style
        name: Run dotnet format style
        entry: make format-dotnet-style
        verbose: true
        language: system
        pass_filenames: false
        types: ["c#"]
        stages: [manual]
        description: Clean up unused C# imports only (IDE0005)
      - id: csharpier
        name: CSharpier
        entry: dotnet csharpier format
        language: system
        files: '\.(cs|csproj|props|targets|slnx|xml|config)$'
        require_serial: true
        stages: [pre-commit, manual]
