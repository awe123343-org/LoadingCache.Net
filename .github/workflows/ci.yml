name: Correctness

on:
  workflow_call:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-quality: ga
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: .pre-commit-config.yaml
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "25"
      - name: Validate formatting
        run: bash pre-commit.sh
      - name: Test release tooling
        run: uv run --no-project python -m unittest discover -s tools -p 'test_*.py'

  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: ga
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Record actual environment
        run: dotnet --info
      - run: dotnet restore LoadingCache.slnx
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - name: Build and detect unused imports (IDE0005)
        run: dotnet build LoadingCache.slnx -c Release --no-restore
      - name: Test .NET 8
        run: dotnet test tests/LoadingCache.Tests/LoadingCache.Tests.csproj -c Release --no-build --no-restore -f net8.0 --logger "trx;LogFileName=net8.trx" --results-directory artifacts/test-results
      - name: Test .NET 10
        run: dotnet test tests/LoadingCache.Tests/LoadingCache.Tests.csproj -c Release --no-build --no-restore -f net10.0 --logger "trx;LogFileName=net10.trx" --results-directory artifacts/test-results
      - name: Run .NET 8 source consumer
        run: dotnet run --project tests/LoadingCache.ConsumerSmoke/LoadingCache.ConsumerSmoke.csproj -c Release --no-build --no-restore -f net8.0
      - name: Run .NET 10 source consumer
        run: dotnet run --project tests/LoadingCache.ConsumerSmoke/LoadingCache.ConsumerSmoke.csproj -c Release --no-build --no-restore -f net10.0
      - name: Test DI .NET 8
        run: dotnet test tests/LoadingCache.DependencyInjection.Tests/LoadingCache.DependencyInjection.Tests.csproj -c Release --no-build --no-restore -f net8.0 --logger "trx;LogFileName=di-net8.trx" --results-directory artifacts/test-results
      - name: Test DI .NET 10
        run: dotnet test tests/LoadingCache.DependencyInjection.Tests/LoadingCache.DependencyInjection.Tests.csproj -c Release --no-build --no-restore -f net10.0 --logger "trx;LogFileName=di-net10.trx" --results-directory artifacts/test-results
      - name: Short stress .NET 8
        run: dotnet test tests/LoadingCache.StressTests/LoadingCache.StressTests.csproj -c Release --no-build --no-restore -f net8.0 --logger "trx;LogFileName=stress-net8.trx" --results-directory artifacts/test-results
      - name: Short stress .NET 10
        run: dotnet test tests/LoadingCache.StressTests/LoadingCache.StressTests.csproj -c Release --no-build --no-restore -f net10.0 --logger "trx;LogFileName=stress-net10.trx" --results-directory artifacts/test-results
      - name: ASP.NET Core host smoke
        run: dotnet samples/LoadingCache.AspNetCore/bin/Release/net10.0/LoadingCache.AspNetCore.dll --smoke
      - name: gRPC host smoke
        run: dotnet samples/LoadingCache.Grpc/bin/Release/net10.0/LoadingCache.Grpc.dll --smoke
      - name: Worker host smoke
        run: dotnet samples/LoadingCache.Worker/bin/Release/net10.0/LoadingCache.Worker.dll --smoke
      - name: Build API baseline tool
        run: dotnet build tools/LoadingCache.ApiBaseline/LoadingCache.ApiBaseline.csproj -c Release
      - name: Verify public API baseline against resolved compile references
        shell: bash
        run: |
          uv run --no-project python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          project = "src/LoadingCache.Extensions.DependencyInjection/LoadingCache.Extensions.DependencyInjection.csproj"
          resolved = subprocess.check_output([
              "dotnet", "msbuild", project, "-t:ResolveReferences",
              "-p:Configuration=Release", "-getItem:ReferencePath",
          ], text=True)
          directories = sorted({
              str(Path(item.get("ReferenceAssembly") or item["FullPath"]).parent)
              for item in json.loads(resolved)["Items"]["ReferencePath"]
          })
          references = [argument for directory in directories for argument in ("--reference-directory", directory)]
          tool = ["dotnet", "tools/LoadingCache.ApiBaseline/bin/Release/net10.0/LoadingCache.ApiBaseline.dll"]
          subprocess.run([*tool, "self-test", *references], check=True)
          subprocess.run([
              *tool, "check", *references,
              "--assembly", "src/LoadingCache/obj/Release/net8.0/ref/LoadingCache.dll",
              "--assembly", "src/LoadingCache.Extensions.DependencyInjection/obj/Release/net8.0/ref/LoadingCache.Extensions.DependencyInjection.dll",
              "--baseline-directory", "tools/LoadingCache.ApiBaseline/baselines",
              "--evidence", "artifacts/api-baseline/check.json",
          ], check=True)
          PY
      - name: Pack and inspect local NuGet packages
        run: uv run --no-project python tools/pack-release.py --local-validation --output artifacts/nuget-ci
      - name: Run core and DI PackageReference consumers on .NET 8 and .NET 10
        run: >-
          uv run --no-project python tools/package-consumers.py
          --feed artifacts/nuget-ci/packages
          --output artifacts/nuget-ci-consumers
          --core-id LoadingCache.LocalValidation
          --di-id LoadingCache.Extensions.DependencyInjection.LocalValidation
          --version 0.1.0-alpha.localvalidation
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: warn
      - name: Preserve package and API evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-api-results-${{ matrix.os }}
          path: |
            artifacts/api-baseline
            artifacts/nuget-ci/results.json
            artifacts/nuget-ci/*.log
            artifacts/nuget-ci/packages
            artifacts/nuget-ci-consumers/results.json
            artifacts/nuget-ci-consumers/*.log
          if-no-files-found: warn

  jvm-benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build JVM comparison harness
        run: ./gradlew :caffeine-write:build :caffeine-write:installDist
      - name: Verify JMH execution only
        run: ./gradlew :caffeine-write:run --args='baseline.CaffeineWriteDrainBenchmark.putBatchAndQuiesce -p workers=1 -p writesPerWorker=512 -p capacity=1024 -p statistics=off -p valueMode=same -wi 0 -i 1 -r 100ms -f 1'

  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Verify benchmark execution only
        run: dotnet run --project benchmarks/LoadingCache.Benchmarks/LoadingCache.Benchmarks.csproj -c Release -f net10.0 -- --job Dry --filter "*LookupBenchmarks*" --exporters json --artifacts artifacts/benchmarks/lookup-smoke
      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-smoke
          path: artifacts/benchmarks/lookup-smoke
          if-no-files-found: warn
