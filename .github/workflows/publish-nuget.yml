# Each package has one net8.0 asset; CI exercises .NET 8 and .NET 10 consumers.
# Core and DI are separate capabilities, not runtime-specific releases.
name: NuGet release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Alpha snapshot, or explicitly retry the official VERSION release
        type: choice
        default: alpha
        options: [alpha, official]

permissions:
  contents: read

env:
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  DOTNET_NOLOGO: true

concurrency:
  group: nuget-publication
  cancel-in-progress: false

jobs:
  select:
    name: Select release version
    if: github.actor_id == '8992564' && github.actor == 'awe123343' && github.triggering_actor == 'awe123343' && github.repository == 'awe123343/LoadingCache.Net' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.11"
      - name: Select version from VERSION
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          CHANNEL: ${{ inputs.channel }}
        run: uv run --no-project python tools/release_version.py

  verify:
    name: Verify repository
    needs: select
    if: needs.select.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  pack:
    name: Pack release artifacts
    if: github.actor_id == '8992564' && github.actor == 'awe123343' && github.triggering_actor == 'awe123343' && github.repository == 'awe123343/LoadingCache.Net'
    needs: [select, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      NUGET_CORE_PACKAGE_ID: ${{ vars.NUGET_CORE_PACKAGE_ID }}
      NUGET_DI_PACKAGE_ID: ${{ vars.NUGET_DI_PACKAGE_ID }}
      NUGET_AUTHORS: ${{ vars.NUGET_AUTHORS }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      REPOSITORY_COMMIT: ${{ github.sha }}
      RELEASE_VERSION: ${{ needs.select.outputs.version }}
    steps:
      - name: Fix release identity for this pack attempt
        id: version
        env:
          NUGET_USERNAME: ${{ vars.NUGET_USERNAME }}
        run: |
          for name in NUGET_CORE_PACKAGE_ID NUGET_DI_PACKAGE_ID NUGET_AUTHORS NUGET_USERNAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository variable $name is not configured."
              exit 1
            fi
          done
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: ga
      - name: Build package inputs
        run: dotnet build LoadingCache.slnx -c Release
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.11"
      - name: Pack and inspect packages
        run: |
          uv run --no-project python tools/pack-release.py \
            --output artifacts/nuget \
            --version "$RELEASE_VERSION" \
            --core-id "$NUGET_CORE_PACKAGE_ID" \
            --di-id "$NUGET_DI_PACKAGE_ID" \
            --authors "$NUGET_AUTHORS" \
            --repository-url "$REPOSITORY_URL" \
            --repository-commit "$REPOSITORY_COMMIT"
      - name: Restore and run package consumers
        run: |
          uv run --no-project python tools/package-consumers.py \
            --feed artifacts/nuget/packages \
            --output artifacts/nuget-consumers \
            --core-id "$NUGET_CORE_PACKAGE_ID" \
            --di-id "$NUGET_DI_PACKAGE_ID" \
            --version "$RELEASE_VERSION"
      - name: Preserve packaging diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-validation-${{ env.RELEASE_VERSION }}
          path: |
            artifacts/nuget/*.log
            artifacts/nuget/results.json
            artifacts/nuget-consumers/*.log
            artifacts/nuget-consumers/results.json
          if-no-files-found: warn
      - name: Preserve release artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-release-${{ env.RELEASE_VERSION }}
          path: |
            artifacts/nuget/packages
            artifacts/nuget/results.json
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    if: github.actor_id == '8992564' && github.actor == 'awe123343' && github.triggering_actor == 'awe123343'
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: nuget.org
      url: https://www.nuget.org/
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_USERNAME: ${{ vars.NUGET_USERNAME }}
      NUGET_CORE_PACKAGE_ID: ${{ vars.NUGET_CORE_PACKAGE_ID }}
      NUGET_DI_PACKAGE_ID: ${{ vars.NUGET_DI_PACKAGE_ID }}
      NUGET_AUTHORS: ${{ vars.NUGET_AUTHORS }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      REPOSITORY_COMMIT: ${{ github.sha }}
      RELEASE_VERSION: ${{ needs.pack.outputs.version }}
    steps:
      - name: Verify publish context
        env:
          ACTOR_ID: ${{ github.actor_id }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          test -n "$NUGET_USERNAME"
          if [[ "$ACTOR_ID" != 8992564 || "$ACTOR" != awe123343 || "$TRIGGERING_ACTOR" != awe123343 ]]; then
            echo "::error::Only awe123343 may start or rerun publication."
            exit 1
          fi
          if [[ ( "$EVENT_NAME" != push && "$EVENT_NAME" != workflow_dispatch ) || "$REF" != refs/heads/main || "$REPOSITORY" != awe123343/LoadingCache.Net ]]; then
            echo "::error::Publishing is allowed only from awe123343/LoadingCache.Net main."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          path: artifacts/nuget
          merge-multiple: true
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.11"
      - name: Verify immutable release manifest
        id: verify-artifact
        env:
          ARTIFACT_ROOT: artifacts/nuget
        run: |
          uv run --no-project python tools/verify_release_artifact.py
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ env.NUGET_USERNAME }}
      - name: Push core package and adjacent symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.verify-artifact.outputs.core_package }}
        run: |
          dotnet nuget push "$PACKAGE" \
            --api-key "$NUGET_API_KEY" \
            --source "$NUGET_SOURCE" \
            --timeout 300
      - name: Push DI package and adjacent symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.verify-artifact.outputs.di_package }}
        run: |
          dotnet nuget push "$PACKAGE" \
            --api-key "$NUGET_API_KEY" \
            --source "$NUGET_SOURCE" \
            --timeout 300

  github-release:
    name: Publish GitHub release
    needs: [pack, publish]
    if: github.actor_id == '8992564' && github.actor == 'awe123343' && github.triggering_actor == 'awe123343' && github.repository == 'awe123343/LoadingCache.Net' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NUGET_CORE_PACKAGE_ID: ${{ vars.NUGET_CORE_PACKAGE_ID }}
      NUGET_DI_PACKAGE_ID: ${{ vars.NUGET_DI_PACKAGE_ID }}
      NUGET_AUTHORS: ${{ vars.NUGET_AUTHORS }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      REPOSITORY_COMMIT: ${{ github.sha }}
      RELEASE_VERSION: ${{ needs.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          path: artifacts/nuget
          merge-multiple: true
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.11"
      - name: Verify immutable release manifest
        env:
          ARTIFACT_ROOT: artifacts/nuget
        run: uv run --no-project python tools/verify_release_artifact.py
      - name: Create release with verified packages and source tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$RELEASE_VERSION"
          # Never attach these packages to an existing or moved tag.
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq "map(select(.ref == \"refs/tags/$tag\")) | length")
          if [[ "$refs" != 0 ]]; then
            echo "::error::Release tag already exists; inspect the previous attempt before recovery."
            exit 1
          fi
          prerelease=false
          latest=true
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=true
            latest=false
          fi
          printf '%s\n' \
            "LoadingCache.Net $RELEASE_VERSION" \
            "" \
            "Source commit: $REPOSITORY_COMMIT" \
            "" \
            "- Core: https://www.nuget.org/packages/$NUGET_CORE_PACKAGE_ID/$RELEASE_VERSION" \
            "- DI: https://www.nuget.org/packages/$NUGET_DI_PACKAGE_ID/$RELEASE_VERSION" \
            "" \
            "Assets are the same validated archives submitted to NuGet.org, without rebuilding." \
            "results.json records source identity and SHA-256 checksums." \
            "GitHub provides source ZIP/tar.gz downloads from this release tag." \
            > artifacts/release-notes.md
          # Upload everything while draft, then make the complete release visible.
          gh release create "$tag" artifacts/nuget/packages/*.nupkg \
            artifacts/nuget/packages/*.snupkg artifacts/nuget/results.json \
            --target "$REPOSITORY_COMMIT" --title "$tag" \
            --notes-file artifacts/release-notes.md --prerelease="$prerelease" --latest="$latest" --draft
          gh release edit "$tag" --draft=false --prerelease="$prerelease" --latest="$latest"
