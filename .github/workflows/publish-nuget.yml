name: NuGet release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer 2.0 prerelease version (stable versions are blocked)"
        required: true
        type: string
      publish:
        description: "Publish the validated packages to nuget.org"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  DOTNET_NOLOGO: true

jobs:
  verify:
    name: Verify repository
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  pack:
    name: Pack release artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUGET_CORE_PACKAGE_ID: ${{ vars.NUGET_CORE_PACKAGE_ID }}
      NUGET_DI_PACKAGE_ID: ${{ vars.NUGET_DI_PACKAGE_ID }}
      NUGET_AUTHORS: ${{ vars.NUGET_AUTHORS }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      REPOSITORY_COMMIT: ${{ github.sha }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: ga
      - name: Build package inputs
        run: dotnet build LoadingCache.slnx -c Release
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.11"
      - name: Pack and inspect packages
        run: |
          uv run --no-project python tools/pack-release.py \
            --output artifacts/nuget \
            --version "$RELEASE_VERSION" \
            --core-id "$NUGET_CORE_PACKAGE_ID" \
            --di-id "$NUGET_DI_PACKAGE_ID" \
            --authors "$NUGET_AUTHORS" \
            --repository-url "$REPOSITORY_URL" \
            --repository-commit "$REPOSITORY_COMMIT"
      - name: Restore and run package consumers
        run: |
          uv run --no-project python tools/package-consumers.py \
            --feed artifacts/nuget/packages \
            --output artifacts/nuget-consumers \
            --core-id "$NUGET_CORE_PACKAGE_ID" \
            --di-id "$NUGET_DI_PACKAGE_ID" \
            --version "$RELEASE_VERSION"
      - name: Preserve packaging diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-validation-${{ inputs.version }}
          path: |
            artifacts/nuget/*.log
            artifacts/nuget/results.json
            artifacts/nuget-consumers/*.log
            artifacts/nuget-consumers/results.json
          if-no-files-found: warn
      - name: Preserve release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-release-${{ inputs.version }}
          path: |
            artifacts/nuget/packages
            artifacts/nuget/results.json
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    if: ${{ inputs.publish }}
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: nuget.org
      url: https://www.nuget.org/
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_USERNAME: ${{ vars.NUGET_USERNAME }}
      NUGET_CORE_PACKAGE_ID: ${{ vars.NUGET_CORE_PACKAGE_ID }}
      NUGET_DI_PACKAGE_ID: ${{ vars.NUGET_DI_PACKAGE_ID }}
      NUGET_AUTHORS: ${{ vars.NUGET_AUTHORS }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      REPOSITORY_COMMIT: ${{ github.sha }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Verify publish context
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref }}
        run: |
          test -n "$NUGET_USERNAME"
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$REF" != "$expected_ref" ]]; then
            echo "::error::Publishing is allowed only from $expected_ref (received $REF)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-release-${{ inputs.version }}
          path: artifacts/nuget
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.11"
      - name: Verify immutable release manifest
        id: verify-artifact
        env:
          ARTIFACT_ROOT: artifacts/nuget
        run: |
          uv run --no-project python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_ROOT"]).resolve()
          report = json.loads((root / "results.json").read_text(encoding="utf-8"))
          expected = {
              "version": os.environ["RELEASE_VERSION"],
              "core_id": os.environ["NUGET_CORE_PACKAGE_ID"],
              "di_id": os.environ["NUGET_DI_PACKAGE_ID"],
              "authors": os.environ["NUGET_AUTHORS"],
              "repository_url": os.environ["REPOSITORY_URL"],
              "repository_commit": os.environ["REPOSITORY_COMMIT"],
          }
          if report.get("result") != "passed" or report.get("mode") != "release" or report.get("local_validation") is not False:
              raise SystemExit("release manifest is not an independently passed release artifact")
          if report.get("source_unchanged") is not True or not report.get("source_manifest_before") or not report.get("source_manifest_after"):
              raise SystemExit("release manifest does not prove source identity was unchanged")
          if report["source_manifest_before"] != report["source_manifest_after"]:
              raise SystemExit("release source manifests differ")
          metadata = report.get("metadata", {})
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"release metadata mismatch for {key}")
          entries = report.get("package_manifests")
          if not isinstance(entries, list) or len(entries) != 2 or {entry.get("role") for entry in entries} != {"core", "dependency-injection"}:
              raise SystemExit("release manifest must contain exactly core and dependency-injection entries")
          package_dir = (root / "packages").resolve()
          actual = {item.name for item in package_dir.iterdir() if item.is_file() and item.suffix in {".nupkg", ".snupkg"}}
          expected_files = {entry[key] for entry in entries for key in ("nupkg", "snupkg")}
          if actual != expected_files or len(actual) != 4:
              raise SystemExit("package directory does not exactly match manifest archives")
          by_role = {entry["role"]: entry for entry in entries}
          outputs = {}
          for role in ("core", "dependency-injection"):
              entry = by_role[role]
              if entry.get("version") != expected["version"] or entry.get("id") != (expected["core_id"] if role == "core" else expected["di_id"]):
                  raise SystemExit(f"unexpected {role} package identity")
              for kind, digest_key in (("nupkg", "nupkg_sha256"), ("snupkg", "snupkg_sha256")):
                  name = entry.get(kind)
                  if not isinstance(name, str) or Path(name).name != name or Path(name).suffix != f".{kind}":
                      raise SystemExit(f"unsafe {role} archive path")
                  if name != f"{entry['id']}.{entry['version']}.{kind}":
                      raise SystemExit(f"unexpected {role} archive name")
                  archive = package_dir / name
                  digest = hashlib.sha256(archive.read_bytes()).hexdigest()
                  if digest != entry.get(digest_key):
                      raise SystemExit(f"SHA256 mismatch for {name}")
              outputs[role] = str(package_dir / entry["nupkg"])
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"core_package={outputs['core']}\n")
              output.write(f"di_package={outputs['dependency-injection']}\n")
          PY
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ env.NUGET_USERNAME }}
      - name: Push core package and adjacent symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.verify-artifact.outputs.core_package }}
        run: |
          dotnet nuget push "$PACKAGE" \
            --api-key "$NUGET_API_KEY" \
            --source "$NUGET_SOURCE" \
            --timeout 300
      - name: Push DI package and adjacent symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.verify-artifact.outputs.di_package }}
        run: |
          dotnet nuget push "$PACKAGE" \
            --api-key "$NUGET_API_KEY" \
            --source "$NUGET_SOURCE" \
            --timeout 300
